apiVersion: apps/v1
kind: Deployment
metadata:
  name: outpost
  namespace: nori-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outpost
  template:
    metadata:
      labels:
        app: outpost
    spec:
      containers:
        - image: ghcr.io/nori-cloud/outpost:1e58ec6
          name: outpost
          envFrom:
            - secretRef:
                name: outpost-secret
          ports:
            - containerPort: 3000