apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: to-speckit-secret
  namespace: nori-cloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-nori-cloud
    kind: SecretStore
  target:
    name: to-speckit-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /to-speckit/DATABASE_URL
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: /to-speckit/BETTER_AUTH_SECRET
    - secretKey: BETTER_AUTH_URL
      remoteRef:
        key: /to-speckit/BETTER_AUTH_URL
    - secretKey: AUTHENTIK_CLIENT_ID
      remoteRef:
        key: /to-speckit/AUTHENTIK_CLIENT_ID
    - secretKey: AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: /to-speckit/AUTHENTIK_CLIENT_SECRET
    - secretKey: AUTHENTIK_ISSUER
      remoteRef:
        key: /to-speckit/AUTHENTIK_ISSUER
