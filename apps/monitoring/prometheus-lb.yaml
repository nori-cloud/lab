apiVersion: v1
kind: Service
metadata:
  name: prometheus-lb
  namespace: nori-cloud
  labels:
    app: prometheus-lb
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: kube-prometheus-stack-prometheus
  ports:
    - name: http-web
      port: 9090
      targetPort: 9090
      protocol: TCP
