# kube-prometheus-stack Helm values
# Configured for Talos Linux cluster with external Grafana

# Disable Grafana - using external instance
grafana:
  enabled: false

# Enable Alertmanager
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# Prometheus configuration
prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Scrape Talos node metrics (replaces node-exporter)
    additionalScrapeConfigs:
      - job_name: 'talos-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.+):(.+)'
            target_label: __address__
            replacement: '${1}:9100'
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

# Disable node-exporter - Talos exposes metrics natively on :9100
nodeExporter:
  enabled: false

# Disable Prometheus node-exporter subchart
prometheus-node-exporter:
  enabled: false

# Enable kube-state-metrics for Kubernetes object metrics
kubeStateMetrics:
  enabled: true

# Enable kube-state-metrics subchart
kube-state-metrics:
  enabled: true

# Component scrapers - adjust for Talos
kubeControllerManager:
  enabled: false  # Talos runs these differently

kubeScheduler:
  enabled: false  # Talos runs these differently

kubeProxy:
  enabled: false  # Talos uses kube-proxy but metrics may not be exposed

kubeEtcd:
  enabled: false  # Can be enabled if etcd metrics are exposed

# Kubelet metrics - should work on Talos
kubelet:
  enabled: true
