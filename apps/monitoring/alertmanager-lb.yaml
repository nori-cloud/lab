apiVersion: v1
kind: Service
metadata:
  name: alertmanager-lb
  namespace: nori-cloud
  labels:
    app: alertmanager-lb
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: kube-prometheus-stack-alertmanager
  ports:
    - name: http-web
      port: 9093
      targetPort: 9093
      protocol: TCP
