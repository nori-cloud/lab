apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: nori-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - image: ghcr.io/nori-cloud/ui:7a57d0d
          name: ui
          ports:
            - containerPort: 8080
