apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: nori-cloud
  labels:
    app: openclaw
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:main
          ports:
            - containerPort: 18789
              name: http
          envFrom:
            - secretRef:
                name: openclaw-secret
          env:
            - name: OPENCLAW_GATEWAY_PORT
              value: "18789"
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /
              port: 18789
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
