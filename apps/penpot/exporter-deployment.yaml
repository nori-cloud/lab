apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-exporter
  namespace: nori-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot
      component: exporter
  template:
    metadata:
      labels:
        app: penpot
        component: exporter
    spec:
      containers:
        - name: exporter
          image: penpotapp/exporter:latest
          env:
            - name: PENPOT_PUBLIC_URI
              value: "http://penpot-frontend:8080"
            - name: PENPOT_REDIS_URI
              value: "redis://valkey.nori-cloud:6379/0"
            - name: PENPOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: penpot-secret
                  key: PENPOT_SECRET_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
