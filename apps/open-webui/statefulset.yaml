apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: open-webui
  namespace: nori-cloud
spec:
  serviceName: open-webui
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:git-ccd3295-ollama
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: WEBUI_URL
              value: "https://chat.norriswu.me"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: ENABLE_RAG_WEB_SEARCH
              value: "true"
            - name: RAG_WEB_SEARCH_ENGINE
              value: "searxng"
            - name: RAG_WEB_SEARCH_RESULT_COUNT
              value: "3"
            - name: RAG_WEB_SEARCH_CONCURRENT_REQUESTS
              value: "10"
            - name: SEARXNG_QUERY_URL
              value: "http://searxng.nori-cloud.svc.cluster.local:8080/search?q=<query>"
          envFrom:
            - secretRef:
                name: open-webui-secret
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: ollama-data
              mountPath: /root/.ollama
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "10Gi"
              cpu: "2000m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: freenas-nfs
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: ollama-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: freenas-nfs
        resources:
          requests:
            storage: 50Gi
