apiVersion: apps/v1
kind: Deployment
metadata:
  name: visa
  namespace: nori-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visa
  template:
    metadata:
      labels:
        app: visa
    spec:
      containers:
        - image: ghcr.io/nori-cloud/visa:cc7286d
          name: visa
          ports:
            - containerPort: 3000
