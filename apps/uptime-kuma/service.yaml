apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: nori-cloud
  labels:
    app: uptime-kuma
  annotations:
    tailscale.com/hostname: uptime
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: uptime-kuma
  ports:
    - port: 80
      targetPort: 3001
      name: http
