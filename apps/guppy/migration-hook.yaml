apiVersion: batch/v1
kind: Job
metadata:
  name: guppy-migration-hook
  generateName: guppy-migration-
  namespace: nori-cloud
  annotations:
    # PreSync hook runs before the main application manifests are applied
    argocd.argoproj.io/hook: PreSync
    # Delete the job after successful completion to avoid resource accumulation
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    # Set weight to ensure this runs first among PreSync hooks
    argocd.argoproj.io/hook-weight: "-10"
spec:
  # Ensure the job doesn't run indefinitely
  backoffLimit: 3
  activeDeadlineSeconds: 600 # 10 minutes timeout
  template:
    metadata:
      labels:
        app: guppy-migration
        hook-type: presync
    spec:
      containers:
        - name: migrate
          image: ghcr.io/nori-cloud/guppy-migrations:sha-080b9b22e3a26e9f40bcbffdaaba75ed83399f6a
          envFrom:
            - secretRef:
                name: guppy-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      restartPolicy: Never
      # Use the same image pull secrets as the main deployment
      imagePullSecrets:
        - name: ghcr-image-pull-secret
