# devbox sshd overrides — access is gated by the tailnet ACL on tag:devbox,
# so login itself is intentionally open for the `dev` user only.
PermitRootLogin no
AllowUsers dev
PasswordAuthentication yes
PermitEmptyPasswords yes
KbdInteractiveAuthentication no

# Host keys live on the persisted /opt PVC so the fingerprint is stable across
# pod restarts (no client MITM warnings). Generated by the entrypoint if absent.
HostKey /opt/ssh/ssh_host_ed25519_key
HostKey /opt/ssh/ssh_host_rsa_key
