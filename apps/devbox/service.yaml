apiVersion: v1
kind: Service
metadata:
  name: devbox-ssh
  namespace: nori-cloud
  labels:
    app: devbox
  annotations:
    # Operator-managed tailnet exposure. The proxy is tagged tag:devbox so the
    # tailnet ACL can gate who may reach tag:devbox:22.
    tailscale.com/hostname: devbox
    tailscale.com/tags: tag:devbox
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: devbox
  ports:
    - name: ssh
      port: 22
      targetPort: 22
