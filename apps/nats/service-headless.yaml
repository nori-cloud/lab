apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: nori-cloud
  labels:
    app: nats
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: 4222
      name: client
    - port: 6222
      targetPort: 6222
      name: cluster
    - port: 8222
      targetPort: 8222
      name: monitor
