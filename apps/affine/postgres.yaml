apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-postgres-data
  namespace: nori-cloud
  labels:
    app: affine-postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: freenas-nfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-postgres
  namespace: nori-cloud
  labels:
    app: affine-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: affine-postgres
  template:
    metadata:
      labels:
        app: affine-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "affine"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: affine-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "affine"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "affine", "-d", "affine"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: affine-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: affine-postgres
  namespace: nori-cloud
  labels:
    app: affine-postgres
spec:
  type: ClusterIP
  selector:
    app: affine-postgres
  ports:
    - port: 5432
      targetPort: 5432
