apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcsmanager-daemon
  labels:
    app: mcsmanager-daemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcsmanager-daemon
  template:
    metadata:
      labels:
        app: mcsmanager-daemon
    spec:
      containers:
      - name: daemon
        image: githubyumao/mcsmanager-daemon:latest
        ports:
        - containerPort: 24444
        env:
        - name: MCSM_DOCKER_WORKSPACE_PATH
          value: "mcsmanager_data/daemon/data/InstanceData"
        volumeMounts:
        - name: timezone
          mountPath: /etc/localtime
          readOnly: true
        - name: daemon-data
          mountPath: /opt/mcsmanager/daemon/data
        - name: daemon-logs
          mountPath: /opt/mcsmanager/daemon/logs
        - name: docker-sock
          mountPath: /var/run/docker.sock
      volumes:
      - name: timezone
        hostPath:
          path: /etc/localtime
          type: File
      - name: daemon-data
        persistentVolumeClaim:
          claimName: mcsmanager-daemon-data
      - name: daemon-logs
        persistentVolumeClaim:
          claimName: mcsmanager-daemon-logs
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: mcsmanager-daemon-service
  labels:
    app: mcsmanager-daemon
spec:
  type: ClusterIP
  ports:
  - port: 24444
    targetPort: 24444
    protocol: TCP
  selector:
    app: mcsmanager-daemon
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcsmanager-daemon-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcsmanager-daemon-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
