apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: koukou-secret
  namespace: nori-cloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-nori-cloud
    kind: SecretStore
  target:
    name: koukou-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: KOUKOU_*
