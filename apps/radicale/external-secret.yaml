apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radicale-secret
  namespace: nori-cloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-nori-cloud
    kind: SecretStore
  target:
    name: radicale-users
  data:
    - secretKey: users
      remoteRef:
        key: /radicale/HTPASSWD
