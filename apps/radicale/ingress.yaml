apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radicale
  namespace: nori-cloud
  labels:
    app: radicale
spec:
  rules:
    - host: cal.norriswu.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radicale
                port:
                  number: 5232
  tls:
    - hosts:
        - cal.norriswu.me
      secretName: norriswu-me-wildcard-tls
