apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: boubou-secret
    namespace: nori-cloud
spec:
    refreshInterval: 1h
    secretStoreRef:
        name: studio-109-prod
        kind: SecretStore
    target:
        name: boubou-secret
        creationPolicy: Owner
    data:
        - secretKey: DATABASE_URL
          remoteRef:
              key: DATABASE_URL
        - secretKey: PORT
          remoteRef:
              key: PORT
        - secretKey: NODE_ENV
          remoteRef:
              key: NODE_ENV
        - secretKey: AWS_S3_BUCKET
          remoteRef:
              key: AWS_S3_BUCKET
        - secretKey: AWS_REGION
          remoteRef:
              key: AWS_REGION
        - secretKey: AWS_ACCESS_KEY_ID
          remoteRef:
              key: AWS_ACCESS_KEY_ID
        - secretKey: AWS_SECRET_ACCESS_KEY
          remoteRef:
              key: AWS_SECRET_ACCESS_KEY
