apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: disco-panel
  namespace: nori-cloud
spec:
  serviceName: disco-panel
  replicas: 1
  selector:
    matchLabels:
      app: disco-panel
  template:
    metadata:
      labels:
        app: disco-panel
    spec:
      containers:
        - name: disco-panel
          image: nickheyer/discopanel:latest
          env:
            - name: DISCOPANEL_DATA_DIR
              value: /app/data
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: TZ
              value: Australia/Sydney
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: disco-data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          ports:
            - containerPort: 25565
              name: mc-0
            - containerPort: 25566
              name: mc-1
            - containerPort: 25567
              name: mc-2
            - containerPort: 25568
              name: mc-3
            - containerPort: 25569
              name: mc-4
            - containerPort: 25570
              name: mc-5
            - containerPort: 25571
              name: mc-6
            - containerPort: 25572
              name: mc-7
            - containerPort: 25573
              name: mc-8
            - containerPort: 25574
              name: mc-9
            - containerPort: 25575
              name: mc-10
          volumeMounts:
            - name: disco-data
              mountPath: /app/data
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
        - name: playit
          image: ghcr.io/playit-cloud/playit-agent:latest
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: disco-panel-secret
                  key: PLAYIT_SECRET_KEY
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
  volumeClaimTemplates:
    - metadata:
        name: disco-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: freenas-nfs
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: dind-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: freenas-nfs
        resources:
          requests:
            storage: 100Gi
