apiVersion: v1
kind: Service
metadata:
  name: disco-panel
  namespace: nori-cloud
spec:
  type: ClusterIP
  selector:
    app: disco-panel
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: disco-panel-playit
  namespace: nori-cloud
  labels:
    app: disco-panel
spec:
  type: LoadBalancer
  selector:
    app: disco-panel
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    - port: 443
      targetPort: 443
      protocol: TCP
      name: https
