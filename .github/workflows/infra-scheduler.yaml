name: Infra Scheduler

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        default: "plan"
        options:
          - plan
          - apply
          - destroy

env:
  TOFU_VERSION: 1.10.6

defaults:
  run:
    working-directory: ./cloud/digital-ocean

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      summary-encoded: ${{ steps.write-summary.outputs.summary-encoded }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Init
        run: tofu init

      - name: Configure Credentials
        env:
          TF_CREDS_BASE64: ${{ secrets.TF_CREDS_BASE64 }}
        run: |
          echo $TF_CREDS_BASE64 | base64 --decode > creds.auto.tfvars

      - name: Bootstrap Infrastructure
        run: |
          ./bootstrap.sh --action ${{ github.event.inputs.action }} > summary.txt
      
      - name: Write Summary to File
        id: write-summary
        if: always()
        run: |
          cat summary.txt
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          SUMMARY_ENCODED=$(cat summary.txt | base64 -w 0)
          echo "summary-encoded=$SUMMARY_ENCODED" >> $GITHUB_OUTPUT

  notify:
    if: ${{ always() }}
    needs: [bootstrap]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Decode Summary
        run: |
          # Decode and prepare summary content
          SUMMARY_ENCODED="${{ needs.bootstrap.outputs.summary-encoded }}"
          echo "$SUMMARY_ENCODED" | base64 --decode > summary_raw.txt
          cat summary_raw.txt

      - name: Format Summary Text
        run: |
          # Convert ANSI colors to colored emojis for better readability
          cat summary_raw.txt | \
            sed 's/\x1b\[32m+/🟢 +/g' | \
            sed 's/\x1b\[31m-/🔴 -/g' | \
            sed 's/\x1b\[33m~/🟡 ~/g' | \
            sed 's/\[32m+/🟢 +/g' | \
            sed 's/\[31m-/🔴 -/g' | \
            sed 's/\[33m~/🟡 ~/g' | \
            sed 's/\x1b\[1m/**/g' | \
            sed 's/\x1b\[0m//g' | \
            sed 's/\[1m/**/g' | \
            sed 's/\[0m//g' | \
            sed 's/\[90m//g' | \
            sed 's/\[33m/🟡 /g' | \
            sed 's/╷/┌/g' | \
            sed 's/╵/└/g' | \
            sed 's/│/│/g' | \
            sed 's/──────────────────────────────────────────────────────────────────────────────/─────────────────────────────────────────────────────────────────────────────/g' | \
            # Clean up any remaining ANSI escape sequences
            sed 's/\x1b\[[0-9;]*m//g' | \
            sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' > summary.txt
          cat summary.txt
          
      - name: Send Summary to Discord
        run: |
          # Create a simple status message
          STATUS_EMOJI="${{ needs.bootstrap.result == 'success' && '✅' || '❌' }}"
          STATUS_COLOR="${{ needs.bootstrap.result == 'success' && '🟢' || '🔴' }}"
          
          # Send message with emoji-colored file attachment
          curl -X POST \
            -F "content=[Nori-Cloud: Infra Workflow] $STATUS_EMOJI Finished with status: **${{ needs.bootstrap.result }}** $STATUS_COLOR 🐱" \
            -F "file=@summary.txt;filename=infra-summary.txt;type=text/plain" \
            ${{ vars.DISCORD_MESSAGE_WEBHOOK }}
  
