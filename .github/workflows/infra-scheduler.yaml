name: Infra Scheduler

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        default: "plan"
        options:
          - plan
          - apply
          - destroy

env:
  TOFU_VERSION: 1.10.6

defaults:
  run:
    working-directory: ./cloud/digital-ocean

jobs:
  plan:
    if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Init
        run: tofu init

      - name: Configure Credentials
        env:
          TF_CREDS_BASE64: ${{ secrets.TF_CREDS_BASE64 }}
        run: |
          echo $TF_CREDS_BASE64 | base64 --decode > creds.auto.tfvars

      - name: Plan Infrastructure
        run: |
          ./bootstrap.sh --action plan >> $GITHUB_STEP_SUMMARY

  apply:
    if: github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Init
        run: tofu init

      - name: Configure Credentials
        env:
          TF_CREDS_BASE64: ${{ secrets.TF_CREDS_BASE64 }}
        run: |
          echo $TF_CREDS_BASE64 | base64 --decode > creds.auto.tfvars

      - name: Apply Infrastructure
        run: |
          ./bootstrap.sh --action apply >> $GITHUB_STEP_SUMMARY

  destroy:
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Init
        run: tofu init

      - name: Configure Credentials
        env:
          TF_CREDS_BASE64: ${{ secrets.TF_CREDS_BASE64 }}
        run: |
          echo $TF_CREDS_BASE64 | base64 --decode > creds.auto.tfvars

      - run: |
          ./bootstrap.sh --action destroy >> $GITHUB_STEP_SUMMARY
  
  notify:
    if: ${{ always() }}
    needs: [plan, apply, destroy]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - run: |
          MSG=""
          case "${{ github.event.inputs.action }}" in
            "plan")
              MSG="finish planning with status of ${{ needs.plan.result }}."
              ;;
            "apply")
              MSG="finish applying with status of ${{ needs.apply.result }}."
              ;;
            "destroy")
              MSG="finish destroying with status of ${{ needs.destroy.result }}."
              ;;
          esac
          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"[Nori-Cloud: Infra Workflow] $MSG meow 🐱\"}" ${{ vars.DISCORD_MESSAGE_WEBHOOK }}
          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"$(cat $GITHUB_STEP_SUMMARY)\"}" ${{ vars.DISCORD_MESSAGE_WEBHOOK }}
  