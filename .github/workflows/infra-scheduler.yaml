name: Infra Scheduler

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        default: "plan"
        options:
          - plan
          - apply
          - destroy

env:
  TOFU_VERSION: 1.10.6

defaults:
  run:
    working-directory: ./cloud/digital-ocean

jobs:
  plan:
    if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Configure Credentials
        run: |
          echo "do_token=$DO_TOKEN" >> creds.auto.tfvars
          echo "cloudflare_dns_admin_token=$CLOUDFLARE_DNS_ADMIN_TOKEN" >> creds.auto.tfvars
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          CLOUDFLARE_DNS_ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_DNS_ADMIN_TOKEN }}

      - name: Plan Infrastructure
        run: |
          ./bootstrap.sh

  apply:
    needs: plan
    if: github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Configure Credentials
        run: |
          echo "do_token=$DO_TOKEN" >> creds.auto.tfvars
          echo "cloudflare_dns_admin_token=$CLOUDFLARE_DNS_ADMIN_TOKEN" >> creds.auto.tfvars
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          CLOUDFLARE_DNS_ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_DNS_ADMIN_TOKEN }}

      - name: Apply Infrastructure
        run: |
          ./bootstrap.sh -a

  destroy:
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - run: |
          tofu destroy -auto-approve
  
  notify:
    if: ${{ always() }}
    needs: [plan, apply, destroy]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - run: |
          MSG=""
          case "${{ github.event.inputs.action }}" in
            "plan")
              MSG="finish planning with status of ${{ needs.plan.result }}."
              ;;
            "apply")
              MSG="finish applying with status of ${{ needs.apply.result }}."
              ;;
            "destroy")
              MSG="finish destroying with status of ${{ needs.destroy.result }}."
              ;;
          esac
          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"[Nori-Cloud: Infra Workflow] $MSG meow 🐱\"}" ${{ vars.DISCORD_MESSAGE_WEBHOOK }}
  