name: Build and Deploy Infra Scheduler

on:
  push:
    paths:
      - 'cloud/scheduler-trigger/src/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      sha-tag: ${{ steps.extract-sha-tag.outputs.sha-tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - id: creds
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AWS_ECR_REGISTRY }}
          username: ${{ steps.creds.outputs.aws-access-key-id }}
          password: ${{ steps.creds.outputs.aws-secret-access-key }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.AWS_ECR_REGISTRY}}/${{ vars.INFRA_SCHEDULER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./cloud/scheduler-trigger
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract SHA tag
        id: extract-sha-tag
        run: |
          # Extract the sha tag from the metadata output
          SHA_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep -o 'sha-[a-f0-9]\{7\}' | head -1)
          echo "sha-tag=$SHA_TAG" >> $GITHUB_OUTPUT
          echo "Extracted SHA tag: $SHA_TAG"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cloud/scheduler-trigger/infra
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::442228337792:role/infra-scheduler-trigger-ga-role

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.5

      - name: Verify Build Output
        run: |
          echo "Build job outputs:"
          echo "SHA tag: ${{ needs.build-and-push.outputs.sha-tag }}"
          echo "Image tags: ${{ needs.build-and-push.outputs.image-tag }}"
          echo ""
          echo "Verifying image exists in ECR..."
          aws ecr describe-images \
            --repository-name ${{ vars.INFRA_SCHEDULER_IMAGE_NAME }} \
            --image-ids imageTag=${{ needs.build-and-push.outputs.sha-tag }} \
            --region ${{ vars.AWS_REGION }}

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Plan
        run: tofu plan -var="image_tag=${{ needs.build-and-push.outputs.sha-tag }}"

      - name: OpenTofu Apply
        run: tofu apply -var="image_tag=${{ needs.build-and-push.outputs.sha-tag }}" -auto-approve

  notify:
    if: ${{ always() }}
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - run: |
          MSG=""
          if [ ${{ github.event.inputs.deploy }} == "true" ]; then
            MSG="finish deploying with status of ${{ needs.deploy.result }}."
          else
            MSG="finish building with status of ${{ needs.build-and-push.result }}."
          fi
          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"[Nori-Cloud: Scheduler Build and Deploy Workflow] $MSG meow 🐱\"}" ${{ vars.DISCORD_MESSAGE_WEBHOOK }}
