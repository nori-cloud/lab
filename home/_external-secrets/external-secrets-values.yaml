# External Secrets Operator Helm values
# https://github.com/external-secrets/external-secrets/tree/main/deploy/charts/external-secrets

installCRDs: true

# Webhook configuration
webhook:
  create: true

# Cert controller for webhook certificates
certController:
  create: true

# Resource limits
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
