apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: networking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: networking
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: nginx
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx
  namespace: networking
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`nginx.home.norriswu.me`)
      kind: Rule
      services:
        - name: nginx
          port: 80
