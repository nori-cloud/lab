# democratic-csi NFS driver configuration
# https://github.com/democratic-csi/democratic-csi

# Use 'next' tag for TrueNAS SCALE 25.x compatibility
# https://github.com/democratic-csi/democratic-csi/issues/479
controller:
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: next
node:
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: next

csiDriver:
  name: "org.democratic-csi.nfs"

storageClasses:
  - name: freenas-nfs
    defaultClass: true
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      detachedVolumesFromSnapshots: "false"
    mountOptions:
      - noatime
      - nfsvers=4
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:

volumeSnapshotClasses:
  - name: freenas-nfs
    parameters:
      detachedSnapshots: "true"

driver:
  existingConfigSecret: democratic-csi-nfs-config
  config:
    driver: freenas-nfs
