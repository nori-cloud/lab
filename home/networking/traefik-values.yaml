priorityClassName: system-cluster-critical

service:
  type: LoadBalancer
  # MetalLB will assign an IP from the configured pool (192.168.0.150-192.168.0.254)
  # Service will be accessible from both local network and Tailscale tailnet

ports:
  web:
    redirect: websecure
  websecure:
    port: 8443
    tls: {}

ingressClass:
  enabled: true
  isDefaultClass: true

ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - websecure
    matchRule: Host(`traefik.norriswu.me`)
    tls:
      secretName: norriswu-me-wildcard-tls

providers:
  kubernetesCRD:
    allowCrossNamespace: true
