service:
  annotations:
    tailscale.com/hostname: home
  spec:
    loadBalancerClass: tailscale

ports:
  web:
    port: 8000
  websecure:
    port: 8443
    tls: {}

ingressClass:
  enabled: true
  isDefaultClass: true

ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - websecure
    matchRule: Host(`traefik.home.norriswu.me`)
    tls:
      secretName: cluster-certificate-secret

providers:
  kubernetesCRD:
    allowCrossNamespace: true
