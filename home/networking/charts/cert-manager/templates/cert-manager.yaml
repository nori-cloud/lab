{{- range .Values.issuers }}
---
# prettier-ignore
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace | quote }}
spec:
  acme:
    email: {{ .acmeEmail }}
    server: {{ .acmeServer }}
    privateKeySecretRef:
      name: {{ .privateKeySecretRef.name }}
    solvers:
{{- .solvers | toYaml | nindent 6 }}
{{- end }}

{{- range .Values.certificates }}
---
# prettier-ignorep
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  secretName: {{ .secretName }}
  issuerRef:
    name: {{ .issuerRef.name }}
    kind: {{ .issuerRef.kind }}
  dnsNames:
{{- range .dnsNames }}
    - {{ . | quote }}
{{- end }}
{{- end }}
