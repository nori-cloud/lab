# prettier-ignore
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .Values.pool.name }}
  namespace: {{ .Values.namespace }}
spec:
  addresses: {{ .Values.pool.addresses }}
---
# prettier-ignore
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ printf "%s-l2-advertisement" .Values.pool.name }}
  namespace: {{ .Values.namespace }}
spec:
  ipAddressPools:
    - {{ .Values.pool.name }}
