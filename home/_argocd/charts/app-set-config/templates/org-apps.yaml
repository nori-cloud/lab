{{- range .Values.orgs }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  annotations:
    # Migration to git-managed (system/tenants/): lets this release be
    # uninstalled without deleting the resource.
    helm.sh/resource-policy: keep
---
# https://argo-cd.readthedocs.io/en/stable/operator-manual/project-specification/
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  description: "{{ .name }} project"
  sourceRepos:
    - {{ .repoURL }}
  destinations:
    - namespace: {{ .name }}
      server: https://kubernetes.default.svc
      name: in-cluster
---
# https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    # CRITICAL: uninstalling this release must never delete the root
    # Application — its resources-finalizer would cascade-delete every
    # tenant app.
    helm.sh/resource-policy: keep
  finalizers:
    # The default behaviour is foreground cascading deletion
    - resources-finalizer.argocd.argoproj.io
    # Alternatively, you can use background cascading deletion
    # - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default

  source:
    repoURL: {{ .repoURL }}
    targetRevision: HEAD
    path: {{ .appsPath }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Release.Namespace | quote }}

  syncPolicy:
    automated:
      enable: true
      prune: true
      selfHeal: true
{{- end }}
