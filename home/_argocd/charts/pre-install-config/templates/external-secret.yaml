apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oauth-client
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    # Migration to git-managed (system/argo-cd/oauth-external-secret.yaml):
    # lets the upcoming helm upgrade drop this resource without deleting it.
    helm.sh/resource-policy: keep
  # https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/#alternative
  # NOTE: Secret must have label app.kubernetes.io/part-of: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  dataFrom:
    - find:
        name:
          regexp: ARGOCD_OAUTH_CLIENT_*
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-nori-cloud-lab-access-token
  namespace: {{ $.Release.Namespace | quote }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: github-nori-cloud-lab-access-token
    template:
      engineVersion: v2
      metadata:
        # https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/#alternative
        # NOTE: Secret must have label app.kubernetes.io/part-of: argocd
        labels:
          app.kubernetes.io/part-of: argocd
          argocd.argoproj.io/secret-type: repository
      data:
        url: https://github.com/nori-cloud/lab
        username: "any-non-empty-string"
        password: "{{ `{{ .password }}` }}"

  data:
  - secretKey: password
    remoteRef:
      key: /github/GITHUB_NORI_CLOUD_LAB_REPO_ACCESS_TOKEN
