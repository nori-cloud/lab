apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Synced by the "system" root Application (see root-application.yaml).
# argo-cd/values.yaml is intentionally NOT listed: it is consumed by the
# argo-cd Application's $values ref, not applied as a manifest.
resources:
  - root-application.yaml
  - argo-cd/app-project.yaml
  - argo-cd/application.yaml
  - argo-cd/oauth-external-secret.yaml
  - tenants/nori-cloud/namespace.yaml
  - tenants/nori-cloud/app-project.yaml
  - tenants/nori-cloud/root-application.yaml
