global:
    domain: argocd.hoki-sole.ts.net
    priorityClassName: system-cluster-critical

configs:
    params:
        server.insecure: true
    cm:
        admin.enabled: false
        dex.config: |
            connectors:
            - config:
                issuer: $argocd-oauth-client:ARGOCD_OAUTH_CLIENT_ISSUER
                clientID: $argocd-oauth-client:ARGOCD_OAUTH_CLIENT_ID
                clientSecret: $argocd-oauth-client:ARGOCD_OAUTH_CLIENT_SECRET
                insecureEnableGroups: true
                scopes:
                  - openid
                  - profile
                  - email
              name: authentik
              type: oidc
              id: authentik
    rbac:
        policy.csv: |
            g, ArgoCD Admins, role:admin
            g, ArgoCD Viewers, role:readonly

server:
    # Served only over the tailnet via the Tailscale Ingress (see extraObjects).
    metrics:
        enabled: true
        serviceMonitor:
            enabled: true
            additionalLabels:
                release: kube-prometheus-stack

repoServer:
    metrics:
        enabled: true
        serviceMonitor:
            enabled: true
            additionalLabels:
                release: kube-prometheus-stack

controller:
    metrics:
        enabled: true
        serviceMonitor:
            enabled: true
            additionalLabels:
                release: kube-prometheus-stack

dex:
    metrics:
        enabled: true
        serviceMonitor:
            enabled: true
            additionalLabels:
                release: kube-prometheus-stack

redis:
    metrics:
        enabled: true
        serviceMonitor:
            enabled: true
            additionalLabels:
                release: kube-prometheus-stack

notifications:
    metrics:
        enabled: true
        serviceMonitor:
            enabled: true
            additionalLabels:
                release: kube-prometheus-stack

applicationSet:
    allowAnyNamespace: true
    metrics:
        enabled: true
        serviceMonitor:
            enabled: true
            additionalLabels:
                release: kube-prometheus-stack

# Expose Argo CD over the tailnet at https://argocd.hoki-sole.ts.net.
# The Tailscale operator terminates TLS (tailnet LetsEncrypt cert) and proxies
# to the argocd-server service. The server runs insecure (plain HTTP on :8080),
# so TLS lives entirely at the Tailscale proxy.
extraObjects:
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
          name: argo-cd-tailscale
      spec:
          ingressClassName: tailscale
          defaultBackend:
              service:
                  name: argo-cd-argocd-server
                  port:
                      number: 80
          # hosts[0] becomes the MagicDNS name -> argocd.hoki-sole.ts.net
          tls:
              - hosts:
                    - argocd
