# Authentik OIDC client credentials for Dex, referenced from values.yaml as
# $argocd-oauth-client:ARGOCD_OAUTH_CLIENT_*.
# Moved from home/_argocd/charts/pre-install-config (the repo-credential
# ExternalSecret stays there: it must exist before Argo CD can sync git).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oauth-client
  namespace: argo-cd
  annotations:
    # Migration-only: lets the pre-install-config helm upgrade drop this
    # resource without deleting it. Remove once the slimming is done.
    helm.sh/resource-policy: keep
  # https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/#alternative
  # NOTE: Secret must have label app.kubernetes.io/part-of: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  dataFrom:
    - find:
        name:
          regexp: ARGOCD_OAUTH_CLIENT_*
