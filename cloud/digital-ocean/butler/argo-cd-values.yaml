global:
  domain: argocd.norriswu.me

configs:
  params:
    server.insecure: true
  cm:
    admin.enabled: false
    dex.config: |
      connectors:
      - config:
          issuer: https://authentik.norriswu.me/application/o/argocd/
          clientID: NgHa6zQP8BCiGxIgfgX0JUWtZEYdaqsEB4qlsUSI
          clientSecret: $dex.authentik.clientSecret
          insecureEnableGroups: true
          scopes:
            - openid
            - profile
            - email
        name: authentik
        type: oidc
        id: authentik
  rbac:
    policy.csv: |
      g, ArgoCD Admins, role:admin
      g, ArgoCD Viewers, role:readonly

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    extraTls:
      - hosts:
        - argocd.norriswu.me
        secretName: wildcard-tls
