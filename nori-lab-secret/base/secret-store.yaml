apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: nori-lab-secret-store
spec:
  provider:
    infisical:
      hostAPI: https://infisical.home.norriswu.me
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            key: client_id
          clientSecret:
            name: infisical-universal-auth
            key: client_secret
      secretsScope:
        projectSlug: nori-lab-ob-bd
        environmentSlug: prod
        secretsPath: /
        recursive: true
